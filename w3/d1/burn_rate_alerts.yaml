groups:
  - name: frontend-slo
    rules:
      - alert: frontend_burn_rate_tier1
        expr: |
          (sum(rate(frontend_rum_fail_total[15m])) / sum(rate(frontend_rum_events_total[15m]))) / (1 - 0.985) >= 3
          AND
          (sum(rate(frontend_rum_fail_total[2m])) / sum(rate(frontend_rum_events_total[2m]))) / (1 - 0.985) >= 3
        labels: {severity: page, tier: "1", service: frontend}
        annotations:
          summary: "Frontend SLO burn rate >= 3 over 15m and 2m"
          runbook: "https://runbooks.example.com/frontend-slo"
      - alert: frontend_burn_rate_tier2
        expr: |
          (sum(rate(frontend_rum_fail_total[1h])) / sum(rate(frontend_rum_events_total[1h]))) / (1 - 0.985) >= 2
          AND
          (sum(rate(frontend_rum_fail_total[5m])) / sum(rate(frontend_rum_events_total[5m]))) / (1 - 0.985) >= 2
        labels: {severity: page, tier: "2", service: frontend}
        annotations:
          summary: "Frontend SLO burn rate >= 2 over 1h and 5m"
          runbook: "https://runbooks.example.com/frontend-slo"
      - alert: frontend_burn_rate_tier3
        expr: |
          (sum(rate(frontend_rum_fail_total[3d])) / sum(rate(frontend_rum_events_total[3d]))) / (1 - 0.985) >= 1
          AND
          (sum(rate(frontend_rum_fail_total[6h])) / sum(rate(frontend_rum_events_total[6h]))) / (1 - 0.985) >= 1
        labels: {severity: ticket, tier: "3", service: frontend}
        annotations:
          summary: "Frontend SLO burn rate >= 1 over 3d and 6h"
          runbook: "https://runbooks.example.com/frontend-slo"

  - name: api-slo
