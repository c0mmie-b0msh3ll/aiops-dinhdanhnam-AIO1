          runbook: "https://runbooks.example.com/api-slo"
      - alert: api_burn_rate_tier2
        expr: |
          (sum(rate(http_requests_fail_total[1h])) / sum(rate(http_requests_total[1h]))) / (1 - 0.99) >= 2
          AND
          (sum(rate(http_requests_fail_total[5m])) / sum(rate(http_requests_total[5m]))) / (1 - 0.99) >= 2
        labels: {severity: page, tier: "2", service: api}
        annotations:
          summary: "API SLO burn rate >= 2 over 1h and 5m"
